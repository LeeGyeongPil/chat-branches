analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - example/build/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - public_member_api_docs
    - unawaited_futures
    - use_super_parameters
