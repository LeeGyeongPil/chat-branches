# No keys or models needed: tests use the toolkit's EchoProvider and a fake provider.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    # Single lane: the Flutter line this package was developed and tested on.
    # firebase_ai is pinned by pubspec_overrides.yaml (kept on purpose).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.x
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter test
        working-directory: example
